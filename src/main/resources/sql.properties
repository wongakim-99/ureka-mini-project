movieSelectAll=SELECT * FROM movie ORDER BY movieid
movieInsertOne=INSERT INTO movie(title, genre, director, rating) VALUES(?,?,?,?)
movieUpdateOne=UPDATE movie SET title=?, genre=?, director=?, rating=? WHERE movieid=?
movieDeleteOne=DELETE FROM movie WHERE movieid=?

theaterSelectAll=SELECT * FROM theater ORDER BY theaterid
theaterInsertOne=INSERT INTO theater(name, total_seats) VALUES(?,?)
theaterUpdateOne=UPDATE theater SET name=?, total_seats=? WHERE theaterid=?
theaterDeleteOne=DELETE FROM theater WHERE theaterid=?

screeningSelectAll=SELECT s.screenid, m.title, t.name AS theater_name, s.showtime, s.price, (t.total_seats - COUNT(r.reservid)) AS remain_seats, s.movieid, s.theaterid FROM screening s JOIN movie m ON s.movieid=m.movieid JOIN theater t ON s.theaterid=t.theaterid LEFT JOIN reservation r ON s.screenid=r.screenid GROUP BY s.screenid, m.title, t.name, s.showtime, s.price, t.total_seats, s.movieid, s.theaterid ORDER BY s.screenid
screeningInsertOne=INSERT INTO screening(movieid, theaterid, showtime, price) VALUES(?,?,?,?)
screeningUpdateOne=UPDATE screening SET movieid=?, theaterid=?, showtime=?, price=? WHERE screenid=?
screeningDeleteOne=DELETE FROM screening WHERE screenid=?
screeningSelectMovieOpts=SELECT movieid, title FROM movie ORDER BY movieid
screeningSelectTheaterOpts=SELECT theaterid, name FROM theater ORDER BY theaterid

custSelectAll=SELECT * FROM customer ORDER BY custid
custInsertOne=INSERT INTO customer(name, phone, email, age) VALUES(?,?,?,?)
custUpdateOne=UPDATE customer SET name=?, phone=?, email=? age=? WHERE custid=?
custDeleteOne=DELETE FROM customer WHERE custid=?

reservSelectAll=SELECT r.reservid, c.name AS cust_name, m.title, t.name AS theater_name, s.showtime, r.seatno, s.price, r.reservdate, r.custid, r.screenid, s.movieid FROM reservation r JOIN customer c ON r.custid=c.custid JOIN screening s ON r.screenid=s.screenid JOIN movie m ON s.movieid=m.movieid JOIN theater t ON s.theaterid=t.theaterid ORDER BY r.reservid
reservInsertOne=INSERT INTO reservation(custid, screenid, seatno, reservdate) VALUES(?,?,?,CURDATE())
reservUpdateOne=UPDATE reservation SET custid=?, screenid=?, seatno=? WHERE reservid=?
reservDeleteOne=DELETE FROM reservation WHERE reservid=?
reservSelectCustOpts=SELECT custid, name FROM customer ORDER BY custid
reservSelectMovieOpts=SELECT DISTINCT m.movieid, m.title FROM movie m JOIN screening s ON m.movieid=s.movieid ORDER BY m.title
reservSelectScreeningsByMovie=SELECT s.screenid, CONCAT(t.name, ' | ', DATE_FORMAT(s.showtime, '%m/%d %H:%i'), ' | ', FORMAT(s.price,0), '원') AS info FROM screening s JOIN theater t ON s.theaterid=t.theaterid WHERE s.movieid=? ORDER BY s.showtime
reservSelectScreenOpts=SELECT s.screenid, CONCAT(m.title, ' / ', t.name, ' / ', DATE_FORMAT(s.showtime, '%Y-%m-%d %H:%i')) AS info FROM screening s JOIN movie m ON s.movieid=m.movieid JOIN theater t ON s.theaterid=t.theaterid ORDER BY s.screenid

salesCalculateAll=SELECT IFNULL(SUM(s.price),0) AS sum_all FROM reservation r JOIN screening s ON r.screenid=s.screenid
selectTotalSaleByMovie=select m.movieid, m.title, sum(price) as total from screening s join reservation r on r.screenid = s.screenid join movie m on m.movieid = s.movieid group by movieid
